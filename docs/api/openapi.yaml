openapi: 3.1.0
info:
  title: IQOT Public API
  version: '1.0.0'
  description: |
    Публичный API IQOT: заявки на закупку B2B-товаров (`/submissions`) и мониторинг цен
    поставщиков по вашей номенклатуре (`/monitoring`).
    Спецификация: см. `IQOT_API_Specification.md`.

    ## Аутентификация
    Bearer-токен в заголовке `Authorization: Bearer iqot_live_<...>`.
    Ключ получается в ЛК `/cabinet/api-keys`. Формат: `iqot_live_` + 48 hex chars.

    ## Идемпотентность
    `POST /submissions` принимает заголовок `Idempotency-Key` (любая строка 1–128 chars).
    Повтор с тем же ключом и идентичным телом возвращает тот же submission_id (200).
    Повтор с тем же ключом и другим телом — 409 `idempotency_key_conflict`.
    Если заголовок не прислан — сервер сгенерирует ключ сам (идемпотентность не работает).

    ## Rate Limits
    - `POST /submissions` — 10 rpm на ключ
    - `GET /submissions/{id}` — 1 запрос в 15 секунд на `(ключ + id)`
    - `POST /monitoring/programs/{id}/items` — 10 rpm на ключ
    - `GET /monitoring/programs/{id}/export` — 6 rpm на ключ
    - Всё вместе — 60 rpm на ключ

    Ответ при превышении: `429 rate_limit_exceeded` + `Retry-After: <seconds>`.
servers:
  - url: https://iqot.ru/api/v1
    description: Production
  - url: https://iqot-platform.test/api/v1
    description: Local (Herd)

security:
  - BearerAuth: []

tags:
  - name: Submissions
    description: Создание, статус, отчёт, отмена заявок
  - name: Account
    description: Баланс
  - name: Taxonomy
    description: Справочники доменов и типов товаров
  - name: Monitoring
    description: |
      Мониторинг цен: регулярный сбор цен поставщиков по вашей номенклатуре (10–30 тыс. позиций).
      IQOT сам находит поставщиков и страницы товаров, сопоставляет их с позициями и обновляет цены;
      в режиме `hybrid` — выборочно подтверждает цены у поставщиков по почте.
  - name: Misc
    description: Диагностика

paths:
  /ping:
    get:
      tags: [Misc]
      summary: Диагностика ключа
      responses:
        '200':
          description: Ключ валиден
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  api_client_id: { type: integer }
                  user_id: { type: integer }
                  server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /submissions:
    post:
      tags: [Submissions]
      summary: Создать submission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '202':
          description: Принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '200':
          description: Replay — тот же Idempotency-Key с идентичным payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Недостаточно средств
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorInsufficientBalance' }
        '409':
          description: Конфликт Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /submissions/{id}:
    get:
      tags: [Submissions]
      summary: Статус submission
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Полный статус submission
          headers:
            X-Status-Changed-At:
              schema: { type: string, format: date-time }
            X-Next-Check-After:
              schema: { type: string, format: date-time }
              description: Рекомендуемое время следующего polling'а
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /submissions/{id}/items:
    get:
      tags: [Submissions]
      summary: Только items submission
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SubmissionItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /submissions/{id}/report:
    get:
      tags: [Submissions]
      summary: JSON-отчёт по КП
      description: Доступен когда хотя бы одна позиция достигла минимума 3 offers.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Отчёт готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Отчёт ещё не готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /submissions/{id}/cancel:
    post:
      tags: [Submissions]
      summary: Отменить submission
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Отменено (или already_final)
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission_id: { type: string }
                  status: { type: string, enum: [cancelled, completed] }
                  cancelled_at: { type: [string, 'null'], format: date-time }
                  was_promoted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /account/balance:
    get:
      tags: [Account]
      summary: Баланс и холды
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }

  /taxonomy/domains:
    get:
      tags: [Taxonomy]
      summary: Список доменов применения
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaxonomyNode' }

  /taxonomy/product-types:
    get:
      tags: [Taxonomy]
      summary: Список типов товаров (leaf)
      parameters:
        - in: query
          name: domain_id
          description: Фильтр типов, ассоциированных с доменом
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaxonomyNode' }
                  filter:
                    type: [object, 'null']
                  count: { type: integer }

  # ─────────────────────────── Мониторинг цен ───────────────────────────
  /monitoring/programs:
    get:
      tags: [Monitoring]
      summary: Список программ мониторинга
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items: { $ref: '#/components/schemas/MonitoringProgram' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Monitoring]
      summary: Создать программу мониторинга
      description: |
        Программа создаётся в статусе `draft`. Загрузите позиции (`POST …/items`), дождитесь
        импорта и запустите программу: `PATCH {status: active}`.
        Доступность и лимит позиций определяет тариф (`plan` в ответе).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitoringProgramRequest' }
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringProgram' }
        '403':
          description: '`monitoring_not_available` — мониторинг не входит в текущий тариф'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/BadRequest' }

  /monitoring/programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [Monitoring]
      summary: Программа — настройки, счётчики позиций и покрытие
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringProgram' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitoring]
      summary: Изменить программу (запуск / пауза / режим / свежесть)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                status: { type: string, enum: [active, paused] }
                price_mode: { type: string, enum: [lite, hybrid] }
                target_freshness_days: { type: integer, minimum: 7, maximum: 180 }
                site_refresh_days: { type: integer, minimum: 7, maximum: 90 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringProgram' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BadRequest' }

  /monitoring/programs/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    post:
      tags: [Monitoring]
      summary: Загрузить / обновить позиции (upsert по client_ref, до 5000 за вызов)
      description: |
        Асинхронно: ответ `202` с `import_id`, ход импорта — `GET …/imports/{import_id}`.
        Повтор с тем же `Idempotency-Key` возвращает тот же импорт.
        `active: false` снимает позицию с мониторинга, `true` — возвращает.
        Позиции сверх лимита тарифа отклоняются построчно (`plan_limit_exceeded` в `errors`).
        Rate limit: 10 вызовов в минуту.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/MonitoringItemInput' }
      responses:
        '202':
          description: Импорт принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringImport' }
        '200':
          description: Повтор по Idempotency-Key — существующий импорт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringImport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Monitoring]
      summary: Позиции программы и статус сопоставления (курсор)
      parameters:
        - name: match_status
          in: query
          schema: { type: string, enum: [pending, matched, ambiguous, rejected] }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MonitoringItem' }
                  next_cursor: { type: [integer, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitoring/programs/{id}/items/{client_ref}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
      - name: client_ref
        in: path
        required: true
        schema: { type: string }
        description: Ваш код позиции (URL-encoded)
    get:
      tags: [Monitoring]
      summary: Карточка позиции — сопоставленный товар, сводка цен, источники и история
      parameters:
        - name: history_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringItemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Monitoring]
      summary: Снять позицию с мониторинга (active=false)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_ref: { type: string }
                  active: { type: boolean, const: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitoring/programs/{id}/imports/{import_id}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
      - name: import_id
        in: path
        required: true
        schema: { type: string, example: imp_01J9Z8K3M4N5P6Q7R8S9T0V1W2 }
    get:
      tags: [Monitoring]
      summary: Ход импорта позиций
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringImport' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitoring/programs/{id}/prices:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [Monitoring]
      summary: Цены позиций — инкрементальная синхронизация
      description: |
        Возвращает позиции, у которых цены изменились с `updated_since` (без параметра — все).
        Синхронизация: сохраните `server_time` из ответа и в следующий раз передайте его как
        `updated_since`. Внутри окна — постранично по `next_cursor`.
      parameters:
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MonitoringPriceItem' }
                  next_cursor: { type: [integer, 'null'] }
                  server_time: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BadRequest' }

  /monitoring/programs/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [Monitoring]
      summary: Выгрузка программы в CSV
      description: |
        UTF-8 с BOM, разделитель `;` (открывается в Excel). Строка на «позицию × источник с ценой»;
        позиции без цены — одной строкой. Колонки: client_ref, name, brand, article, match_status,
        best_price, min_price, median_price, max_price, sources_priced, supplier_domain, url, price,
        currency, vat_included, price_unit, availability, observed_at, web_price, email_confirmed,
        kp, kp_price, site_trust_level. Rate limit: 6 вызовов в минуту.
      responses:
        '200':
          description: CSV-файл
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: iqot_live_<48hex>

  parameters:
    SubmissionId:
      in: path
      name: id
      required: true
      description: Публичный ID (`sub_<ulid>`) или ULID без префикса.
      schema: { type: string, pattern: '^(sub_)?[0-9A-HJKMNP-TV-Z]{26}$' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Клиентский ключ идемпотентности. Если не прислан — генерируется сервером.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ProgramId:
      in: path
      name: id
      required: true
      description: ID программы мониторинга (`mon_<ulid>`) или ULID без префикса.
      schema: { type: string, pattern: '^(mon_)?[0-9A-HJKMNP-TV-Z]{26}$' }
    Cursor:
      in: query
      name: cursor
      required: false
      description: Значение `next_cursor` из предыдущего ответа (постраничный обход).
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Неавторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Превышен rate limit
      headers:
        Retry-After:
          schema: { type: integer }
          description: Через сколько секунд можно повторять
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - invalid_payload
                - invalid_api_key
                - key_revoked
                - ip_not_whitelisted
                - api_client_disabled
                - api_access_denied
                - insufficient_balance
                - overdraft_exceeded
                - sender_not_configured
                - submission_not_found
                - idempotency_key_conflict
                - report_not_ready
                - rate_limit_exceeded
                - internal_error
            message: { type: string }
            request_id: { type: string, format: uuid }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    ErrorInsufficientBalance:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  properties:
                    required_hold: { type: number }
                    balance: { type: number }
                    overdraft_percent: { type: number }

    CreateSubmissionRequest:
      type: object
      required: [items]
      properties:
        client_ref: { type: [string, 'null'], maxLength: 128 }
        client_organization_id: { type: [integer, 'null'], minimum: 1 }
        deadline:
          type: [string, 'null']
          format: date-time
          description: "7-60 дней от текущего момента. Default: +30 дней."
        items:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: '#/components/schemas/SubmissionItemInput' }

    SubmissionItemInput:
      type: object
      required: [name, quantity, unit]
      properties:
        client_ref: { type: [string, 'null'], maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 500 }
        article: { type: [string, 'null'], maxLength: 255 }
        brand: { type: [string, 'null'], maxLength: 255 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        description: { type: [string, 'null'], maxLength: 5000 }
        client_category:
          type: [object, 'null']
          required: [code]
          properties:
            code: { type: string, maxLength: 128 }
            path:
              type: array
              maxItems: 10
              items: { type: string, maxLength: 255 }
            metadata: { type: object, additionalProperties: true }

    SubmissionAccepted:
      type: object
      properties:
        submission_id: { type: string, description: '"sub_<ulid>"' }
        status: { type: string, enum: [accepted] }
        stage: { type: string }
        client_ref: { type: [string, 'null'] }
        items_count: { type: integer }
        created_at: { type: string, format: date-time }
        estimated_ready_at: { type: string, format: date-time }

    SubmissionStatus:
      type: object
      properties:
        submission_id: { type: string }
        client_ref: { type: [string, 'null'] }
        client_organization_id: { type: [integer, 'null'] }
        status:
          type: string
          enum: [accepted, processing, ready, ready_minimum, completed, cancelled]
        stage: { type: string }
        created_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        deadline: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          properties:
            total: { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
            awaiting_suppliers: { type: integer }
            dispatched: { type: integer }
            with_offers_minimum: { type: integer }
            completed: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/SubmissionItem' }
        rejected_items:
          type: array
          items: { $ref: '#/components/schemas/RejectedItem' }

    SubmissionItem:
      type: object
      properties:
        item_id: { type: string }
        client_ref: { type: [string, 'null'] }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
        status:
          type: string
          enum: [pending, accepted, awaiting_suppliers, dispatched, collecting, ready_minimum, completed, rejected]
        classification:
          type: object
          properties:
            product_type:
              type: [object, 'null']
              properties:
                id: { type: integer }
                slug: { type: string }
                name: { type: string }
            domain:
              type: [object, 'null']
              properties:
                id: { type: integer }
                slug: { type: string }
                name: { type: string }
        offers_count: { type: integer }
        minimum_threshold: { type: integer, default: 3 }
        report_available: { type: boolean }
        collection_deadline: { type: [string, 'null'], format: date-time }

    RejectedItem:
      type: object
      properties:
        client_ref: { type: [string, 'null'] }
        name: { type: string }
        reason:
          type: string
          enum: [b2c_consumer_goods, out_of_scope, insufficient_data, duplicate, no_suppliers_available, moderator_rejected, cancelled_by_client]
        message: { type: string }
        retryable: { type: boolean }

    Report:
      type: object
      properties:
        submission_id: { type: string }
        client_ref: { type: [string, 'null'] }
        generated_at: { type: string, format: date-time }
        status: { type: string }
        deadline: { type: [string, 'null'], format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              name: { type: string }
              quantity: { type: number }
              unit: { type: string }
              classification: { $ref: '#/components/schemas/SubmissionItem/properties/classification' }
              offers_count: { type: integer }
              minimum_threshold: { type: integer }
              status: { type: string }
              best_offer_by_price: { $ref: '#/components/schemas/Offer' }
              all_offers:
                type: array
                items: { $ref: '#/components/schemas/Offer' }

    Offer:
      type: object
      properties:
        supplier_id: { type: integer }
        price_per_unit: { type: number }
        total_price: { type: number }
        currency: { type: string, default: RUB }
        price_includes_vat: { type: boolean }
        delivery_days: { type: [integer, 'null'] }
        payment_terms: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        received_at: { type: [string, 'null'], format: date-time }

    Balance:
      type: object
      properties:
        balance: { type: number }
        currency: { type: string, default: RUB }
        active_holds: { type: number }
        overdraft_limit_percent: { type: number }
        overdraft_limit_absolute: { type: number }
        warning:
          type: [string, 'null']
          description: Напр. `overdraft_123.45_rub`

    TaxonomyNode:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        parent_id: { type: [integer, 'null'] }

    # ─────────────────────────── Мониторинг цен ───────────────────────────
    CreateMonitoringProgramRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        price_mode:
          type: string
          enum: [lite, hybrid]
          default: lite
          description: |
            `lite` — цены с сайтов поставщиков; `hybrid` — плюс выборочное подтверждение цен
            поставщиками по почте (растёт доверие к сайту, цены получают признак «подтверждено»).
        target_freshness_days: { type: integer, minimum: 7, maximum: 180, default: 30, description: 'Цена считается свежей, если обновлена за столько дней (покрытие программы)' }
        site_refresh_days: { type: integer, minimum: 7, maximum: 90, default: 14, description: 'Как часто перепроверять цены на сайтах' }
        settings: { type: object, additionalProperties: true }

    MonitoringProgram:
      type: object
      properties:
        program_id: { type: string, example: mon_01M4WTQKJV2RGHZ49NYJ15E38H }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        price_mode: { type: string, enum: [lite, hybrid] }
        target_freshness_days: { type: integer }
        site_refresh_days: { type: integer }
        items:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer, description: 'Позиции на мониторинге' }
            matched: { type: integer, description: 'Однозначно сопоставлены с товаром' }
            ambiguous: { type: integer, description: 'Не однозначно (варианты одного артикула и т. п.) — уточните данные' }
            covered: { type: integer, description: 'Со свежей ценой (в пределах target_freshness_days)' }
        plan:
          type: object
          properties:
            items_max: { type: integer, description: 'Максимум позиций на мониторинге по тарифу' }
            items_included: { type: integer, description: 'Включено в абонентскую плату' }
            price_per_item: { type: number, description: 'Цена покрытой позиции сверх включённых, ₽ в месяц' }
            kp_price_multiplier: { type: number, example: 3, description: 'Множитель ставки для позиции со свежим КП поставщика (режим hybrid)' }
        created_at: { type: string, format: date-time }

    MonitoringItemInput:
      type: object
      required: [client_ref, name]
      properties:
        client_ref: { type: string, maxLength: 191, description: 'Ваш уникальный код позиции (ключ upsert)' }
        name: { type: string, minLength: 2, maxLength: 1000 }
        brand: { type: [string, 'null'], maxLength: 255 }
        article: { type: [string, 'null'], maxLength: 255,  description: 'Артикул производителя (OEM/MPN) — главный ключ поиска; без него поиск идёт по названию' }
        unit: { type: [string, 'null'], maxLength: 32 }
        attributes: { type: [object, 'null'], additionalProperties: true }
        active: { type: [boolean, 'null'], default: true }
        client_category:
          type: [object, 'null']
          description: |
            Ваша категория товара — тот же формат, что в заявках (`/submissions`). Соответствие вашей
            категории и таксономии IQOT устанавливается один раз на категорию и используется для
            подбора поставщиков; без категории позиция мониторится, но не классифицируется.
          required: [code]
          properties:
            code: { type: string, maxLength: 128 }
            path:
              type: array
              maxItems: 10
              items: { type: string, maxLength: 255 }
            metadata: { type: object, additionalProperties: true }

    MonitoringImport:
      type: object
      properties:
        import_id: { type: string, example: imp_01J9Z8K3M4N5P6Q7R8S9T0V1W2 }
        status: { type: string, enum: [queued, processing, done, failed] }
        rows_total: { type: integer }
        rows_ok: { type: integer }
        rows_failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: [integer, 'null'] }
              client_ref: { type: [string, 'null'] }
              error: { type: string, example: plan_limit_exceeded }

    MonitoringItem:
      type: object
      properties:
        client_ref: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        article: { type: [string, 'null'] }
        active: { type: boolean }
        match_status: { type: string, enum: [pending, matched, ambiguous, rejected] }
        match_note: { type: [string, 'null'] }
        last_priced_at: { type: [string, 'null'], format: date-time }

    MonitoringPriceFlags:
      type: object
      description: Признаки цены (независимые, у цены может быть несколько)
      properties:
        web_price: { type: boolean, description: 'Цена получена со страницы сайта поставщика' }
        email_confirmed: { type: boolean, description: 'Поставщик подтвердил цену сайта по почте' }
        kp: { type: boolean, description: 'Есть КП / счёт поставщика по этому товару' }

    MonitoringPriceSource:
      type: object
      description: |
        Цена одного поставщика. `source_type=site` — страница его сайта (цена сайта в `price`, КП — в `kp`;
        у страниц «цена по запросу» `price` пуст, а цена приходит в `kp` после запроса КП).
        `source_type=kp` — только КП поставщика без страницы товара (режим hybrid, запрос КП профильным
        поставщикам IQOT): `url` и `price` пусты, цена — в `kp`.
      properties:
        source_type: { type: string, enum: [site, kp] }
        supplier_domain: { type: [string, 'null'], example: zaplift.ru }
        url: { type: [string, 'null'], format: uri, description: 'Страница поставщика, откуда получена цена (null для source_type=kp)' }
        price: { type: [number, 'null'], description: 'Цена с сайта' }
        currency: { type: [string, 'null'], example: RUB }
        price_kind: { type: [string, 'null'], enum: [retail, from, wholesale_tier, on_request] }
        vat_included: { type: [boolean, 'null'] }
        price_unit: { type: [string, 'null'], enum: [piece, meter, kg, liter, set, pack, unknown] }
        price_unit_qty: { type: [number, 'null'] }
        availability: { type: [string, 'null'], enum: [in_stock, on_order, out_of_stock, unknown] }
        observed_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, suspicious], description: '`suspicious` — резкий скачок/выброс, цена на перепроверке' }
        flags: { $ref: '#/components/schemas/MonitoringPriceFlags' }
        email_confirmed_at: { type: [string, 'null'], format: date-time }
        kp:
          type: [object, 'null']
          properties:
            price: { type: number }
            currency: { type: [string, 'null'] }
            vat_included: { type: [boolean, 'null'] }
            received_at: { type: string, format: date-time }
        site_trust_level: { type: [integer, 'null'], minimum: 0, maximum: 3, description: 'Доверие к ценам сайта (растёт с подтверждениями поставщика), справочно' }
        history:
          type: array
          description: 'Только в карточке позиции: история цен источника за history_days'
          items:
            type: object
            properties:
              observed_at: { type: string, format: date-time }
              price: { type: number }
              currency: { type: [string, 'null'] }
              source: { type: string, enum: [web, kp] }

    MonitoringPriceSummary:
      type: [object, 'null']
      description: 'Сводка по сопоставимым ценам: RUB, розница или «от», статус active. Цена источника — цена сайта, а где её нет — цена КП'
      properties:
        best_price: { type: number }
        min: { type: number }
        median: { type: number }
        max: { type: number }
        sources_priced: { type: integer }
        currency: { type: string, example: RUB }

    MonitoringPriceItem:
      type: object
      properties:
        client_ref: { type: string }
        name: { type: string }
        prices_changed_at: { type: [string, 'null'], format: date-time }
        last_priced_at: { type: [string, 'null'], format: date-time }
        best_price:
          type: [object, 'null']
          properties:
            price: { type: number }
            currency: { type: string }
            supplier_domain: { type: [string, 'null'] }
            url: { type: [string, 'null'], format: uri }
            price_source: { type: string, enum: [web, kp], description: 'web — цена сайта, kp — цена из КП поставщика' }
            flags: { $ref: '#/components/schemas/MonitoringPriceFlags' }
        summary: { $ref: '#/components/schemas/MonitoringPriceSummary' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/MonitoringPriceSource' }

    MonitoringItemDetail:
      allOf:
        - $ref: '#/components/schemas/MonitoringPriceItem'
        - type: object
          properties:
            brand: { type: [string, 'null'] }
            article: { type: [string, 'null'] }
            active: { type: boolean }
            match_status: { type: string, enum: [pending, matched, ambiguous, rejected] }
            match_note: { type: [string, 'null'] }
            product:
              type: [object, 'null']
              description: Сопоставленный товар
              properties:
                name: { type: string }
                brand: { type: [string, 'null'] }
                identifiers:
                  type: array
                  items:
                    type: object
                    properties:
                      kind: { type: string, enum: [oem, mpn, gtin] }
                      value: { type: string }
